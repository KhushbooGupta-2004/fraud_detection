name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (linting)
        run: |
          ruff check src/ --output-format=github

      - name: Run Black (format check)
        run: |
          black --check src/

      - name: Run MyPy (type checking)
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Quick smoke test - run a minimal pipeline
  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic test data
        run: |
          python -c "
          import pandas as pd
          import numpy as np
          from sklearn.datasets import make_classification
          
          X, y = make_classification(n_samples=1000, n_features=20, weights=[0.98, 0.02], random_state=42)
          feature_names = [f'feature_{i}' for i in range(20)]
          df = pd.DataFrame(X, columns=feature_names)
          df['is_fraud'] = y
          df.to_csv('data/raw/indian_transactions.csv', index=False)
          print('Generated synthetic test data')
          "

      - name: Run training smoke test
        run: |
          python -m src.main train

      - name: Run evaluation smoke test
        run: |
          python -m src.main evaluate

      - name: Run threshold optimization smoke test
        run: |
          python -m src.main optimize-threshold

  # Build and test package
  build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*